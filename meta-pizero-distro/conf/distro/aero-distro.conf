DISTRO ?= "aero-distro"
DISTRO_NAME ?= "notpi"
DISTRO_VERSION ?= "1.0"

# dev / prod
IMAGE_TYPE ??= "dev"

# Data partiotion Encryption default is on (1)
DATA_ENCRYPTION ?= "1"

require files/${IMAGE_TYPE}.inc

# Let's use systemd
INIT_MANAGER = "systemd"

#Over engineering
#require files/${@d.getVar("IMAGE_TYPE")}.inc

DISTRO_FEATURES = "ext2"

#This feature is added by DISTRO_FEATURES_BACKFILL
DISTRO_FEATURES:remove = "pulseaudio"

#Disable GPLv3 packages :  AGPL-3.0-only AGPL-3.0-or-later GPL-3.0-only GPL-3.0-or-later LGPL-3.0-only
INCOMPATIBLE_LICENSE:pn-core-myimage = "AGPL-3.0-only AGPL-3.0-or-later GPL-3.0-only GPL-3.0-or-later LGPL-3.0-only"

#Enable image build info
INHERIT += "image-buildinfo"

#Adding rauc feature
DISTRO_FEATURES += "rauc"

#Adding wifi
DISTRO_FEATURES += "wifi"
#Accept restricted license
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"