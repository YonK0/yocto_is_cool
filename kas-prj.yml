header:
  version: 11

machine: aero-rsp
distro: aero-distro
#To change to fab image enter dev-image target as a a param
target: dev-image

repos:
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    refspec: styhead
    type: git
    path: meta-layers/openembedded-core
    layers:
      meta: null

  bitbake:
    url: https://github.com/openembedded/bitbake.git
    refspec: "2.10"
    type: git
    path: meta-layers/bitbake
    layers:
      bitbake: excluded

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    refspec: styhead
    path: meta-layers/meta-raspberrypi
    type: git

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded/meta-oe
    refspec: styhead
    path: meta-layers/meta-openembedded/meta-oe
    type: git

  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    refspec: styhead
    path: meta-layers/meta-rauc
    type: git

  meta-python:
    path:  meta-layers/meta-openembedded/meta-python

  meta-aero-bsp:
    path:  ${TOPDIR}/../meta-aero-bsp
  
  meta-aero-distro:
    path:  ${TOPDIR}/../meta-aero-distro
  
  meta-aero-img:
    path:  ${TOPDIR}/../meta-aero-img

# TOPDIR is /build
local_conf_header:
      #Needs to be fixed from /build to ${TOPDIR}/*
      my_custom_settings: |
        DL_DIR = "/build/DD"
        SSTATE_DIR = "/build/SS"

#PS: DD is creating if the bitbake is downloading something | SS is created when bitbake start cooking