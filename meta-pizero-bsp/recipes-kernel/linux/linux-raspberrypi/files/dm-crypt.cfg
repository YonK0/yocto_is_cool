# Kernel options for LUKS2 on /data (dm-crypt).
#
# dm-verity (rootfs integrity) is already enabled in support_rauc.cfg
# (CONFIG_DM_VERITY / CONFIG_BLK_DEV_DM / CONFIG_CRYPTO_SHA256), so this
# fragment only adds what LUKS2 needs and nothing else.
#
# LUKS2 default data cipher is aes-xts-plain64 with SHA-256 for the digest.
# The argon2id passphrase KDF runs in userspace (cryptsetup), so no kernel
# argon2 option is required.

CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y

# aes-xts-plain64
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_SHA256=y

# Userspace <-> kernel crypto API used by cryptsetup
CONFIG_CRYPTO_USER_API=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
